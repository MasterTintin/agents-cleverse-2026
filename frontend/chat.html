<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <title>Private Skills POC — Chat</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --border: #334155;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #6366f1;
        --user-bubble: #6366f1;
        --skill-bubble: #1e293b;
        --error: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", "Sarabun", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }
      header h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      header p {
        margin: 4px 0 0;
        font-size: 12px;
        color: var(--muted);
      }
      #status-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        margin-right: 6px;
      }
      #status-dot.ok {
        background: #4ade80;
      }
      #status-dot.down {
        background: var(--error);
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .bubble {
        max-width: 70%;
        padding: 10px 14px;
        border-radius: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        font-size: 14px;
      }
      .user {
        align-self: flex-end;
        background: var(--user-bubble);
        color: white;
        border-bottom-right-radius: 2px;
      }
      .skill {
        align-self: flex-start;
        background: var(--skill-bubble);
        border: 1px solid var(--border);
        border-bottom-left-radius: 2px;
      }
      .skill.error {
        border-color: var(--error);
        color: var(--error);
      }
      .skill.loading {
        color: var(--muted);
        font-style: italic;
      }
      .meta {
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }

      /* --- แนบไฟล์ --- */
      #attachment-bar {
        display: none;
        align-items: center;
        gap: 8px;
        padding: 8px 20px;
        border-top: 1px solid var(--border);
        background: var(--panel);
        font-size: 13px;
      }
      #attachment-bar.show {
        display: flex;
      }
      #attachment-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
      }
      #attachment-remove {
        background: none;
        border: none;
        color: var(--error);
        cursor: pointer;
        font-size: 16px;
        padding: 0 4px;
      }

      form {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 16px 20px;
        border-top: 1px solid var(--border);
      }
      #attach-btn {
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
        width: 40px;
        height: 40px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        flex-shrink: 0;
      }
      #attach-btn:hover {
        border-color: var(--accent);
      }
      input[type="text"] {
        flex: 1;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font-size: 14px;
      }
      input[type="text"]:focus {
        outline: 1px solid var(--accent);
      }
      button[type="submit"] {
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        background: var(--accent);
        color: white;
        font-size: 14px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Private Skills POC</h1>
      <p>
        <span id="status-dot"></span
        ><span id="status-text">กำลังเช็ค Gateway...</span>
      </p>
    </header>

    <div id="messages"></div>

    <div id="attachment-bar">
      <span>📎</span>
      <span id="attachment-name"></span>
      <button id="attachment-remove" type="button" title="เอาไฟล์ออก">✕</button>
    </div>

    <form id="chat-form">
      <button id="attach-btn" type="button" title="แนบไฟล์เอกสาร">📎</button>
      <input
        type="file"
        id="file-input"
        accept=".txt,.md,.csv,.json,.log"
        hidden
      />
      <input
        id="chat-input"
        type="text"
        placeholder="เช่น ช่วยประเมินเอกสารนี้..."
        autocomplete="off"
      />
      <button id="send-btn" type="submit">ส่ง</button>
    </form>

    <script>
      // Gateway เป็นจุดเดียวที่ frontend รู้จัก — ไม่มีการเรียก Protected Skill Service ตรงๆ จาก frontend
      const GATEWAY_URL = "http://127.0.0.1:8000";

      // จำกัดขนาดไฟล์ที่อ่านได้
      const MAX_FILE_SIZE_BYTES = 2 * 1024 * 1024; // 2MB

      const messagesEl = document.getElementById("messages");
      const formEl = document.getElementById("chat-form");
      const inputEl = document.getElementById("chat-input");
      const sendBtn = document.getElementById("send-btn");
      const statusDot = document.getElementById("status-dot");
      const statusText = document.getElementById("status-text");

      const attachBtn = document.getElementById("attach-btn");
      const fileInput = document.getElementById("file-input");
      const attachmentBar = document.getElementById("attachment-bar");
      const attachmentName = document.getElementById("attachment-name");
      const attachmentRemove = document.getElementById("attachment-remove");

      // เก็บไฟล์ที่แนบไว้ปัจจุบัน (รองรับทีละ 1 ไฟล์สำหรับ POC)
      let attachedFile = null;

      function addBubble(text, role) {
        const bubble = document.createElement("div");
        bubble.className = `bubble ${role}`;
        bubble.textContent = text;
        messagesEl.appendChild(bubble);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return bubble;
      }

      async function checkHealth() {
        try {
          const res = await fetch(`${GATEWAY_URL}/health`);
          if (res.ok) {
            statusDot.className = "ok";
            statusText.textContent = "Gateway เชื่อมต่อได้";
          } else {
            throw new Error("not ok");
          }
        } catch {
          statusDot.className = "down";
          statusText.textContent =
            "เชื่อมต่อ Gateway ไม่ได้ (เช็คว่ารัน uvicorn ที่ port 8000 อยู่หรือยัง)";
        }
      }

      // --- แนบไฟล์ ---

      attachBtn.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        fileInput.value = "";
        if (!file) return;

        if (file.size > MAX_FILE_SIZE_BYTES) {
          addBubble(
            `ไฟล์ใหญ่เกินไป (จำกัดไม่เกิน ${MAX_FILE_SIZE_BYTES / 1024 / 1024}MB สำหรับ POC นี้)`,
            "skill error"
          );
          return;
        }

        const reader = new FileReader();
        reader.onload = () => {
          attachedFile = { name: file.name, content: reader.result };
          attachmentName.textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
          attachmentBar.classList.add("show");
        };
        reader.onerror = () => {
          addBubble(
            `อ่านไฟล์ "${file.name}" ไม่สำเร็จ — รองรับเฉพาะไฟล์ text (.txt, .md, .csv, .json, .log)`,
            "skill error"
          );
        };
        reader.readAsText(file);
      });

      attachmentRemove.addEventListener("click", () => {
        attachedFile = null;
        attachmentBar.classList.remove("show");
      });

      // --- ส่งข้อความ ---

      function buildOutgoingMessage(typedText) {
        if (!attachedFile) return typedText;

        const header = `[แนบไฟล์: ${attachedFile.name}]`;
        if (typedText) {
          return `${typedText}\n\n${header}\n${attachedFile.content}`;
        }
        return `${header}\n${attachedFile.content}`;
      }

      async function sendMessage(displayText, outgoingMessage) {
        addBubble(displayText, "user");
        const loadingBubble = addBubble("กำลังประมวลผล...", "skill loading");

        sendBtn.disabled = true;
        inputEl.disabled = true;

        try {
          const res = await fetch(`${GATEWAY_URL}/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: outgoingMessage })
          });

          const data = await res.json();

          loadingBubble.remove();

          if (res.ok) {
            addBubble(data.result, "skill");
          } else {
            // แสดง error message จาก Gateway ตรงๆ — เป็น detail ที่ Gateway ได้รับจาก Skill Service
            addBubble(
              `เกิดข้อผิดพลาด (${res.status}): ${data.detail}`,
              "skill error"
            );
          }
        } catch (err) {
          loadingBubble.remove();
          addBubble(`เชื่อมต่อ Gateway ไม่ได้: ${err.message}`, "skill error");
        } finally {
          sendBtn.disabled = false;
          inputEl.disabled = false;
          inputEl.focus();
        }
      }

      formEl.addEventListener("submit", (e) => {
        e.preventDefault();
        const typedText = inputEl.value.trim();

        if (!typedText && !attachedFile) return;

        const displayText = attachedFile
          ? typedText
            ? `${typedText}  📎 ${attachedFile.name}`
            : `📎 ${attachedFile.name}`
          : typedText;

        const outgoingMessage = buildOutgoingMessage(typedText);

        inputEl.value = "";
        attachedFile = null;
        attachmentBar.classList.remove("show");

        sendMessage(displayText, outgoingMessage);
      });

      checkHealth();
    </script>
  </body>
</html>
